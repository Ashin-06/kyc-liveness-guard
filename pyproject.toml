[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-liveness-guard"
version = "1.0.0"
description = "Liveness checks for video KYC and voice verification: voice, pulse, lip sync and a timed challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.7,<1.8",  # the shipped voice models were pickled with 1.7
    "joblib>=1.3",
    "soundfile>=0.12",
    "opencv-python-headless>=4.8,<5",  # the real-face numbers were measured with OpenCV 4 (Haar cascades)
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "pyarrow>=15"]
realdata = ["pyarrow>=15", "av>=12"]
dashboard = ["streamlit>=1.32", "plotly>=5.18", "pandas>=2.0"]

[project.scripts]
liveness = "liveness.__main__:main"

[tool.setuptools]
packages = ["liveness"]

[tool.setuptools.package-data]
liveness = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["liveness"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
